
---
- hosts: webservers

  tasks:
    - name: php install (Debian)
      apt:
        name:
          - php
          - libapache2-mod-php
          - php-mysql
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
      notify: Apache restart

    - name: php install (CentOS)
      dnf:
        name:
          - php
          - php-common
          - php-mysqlnd
        state: present
      when: ansible_os_family == "RedHat"
      notify: Apache restart

    - name: phpinfo.php faili loomine
      copy:
        dest: /var/www/html/phpinfo.php
        content: |
          <?php
          phpinfo();
          ?>
        mode: '0644'
        
  handlers:
    - name: Apache restart
      service:
        name: "{{ 'apache2' if ansible_os_family == 'Debian' else 'httpd' }}"
        state: restarted
